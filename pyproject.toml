[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdbsent"
version = "0.1.0"
description = "TDT13 project: VADER vs TF-IDF+LR vs Qwen2.5-1.5B-Instruct (zero/few-shot) on IMDb sentiment"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "vaderSentiment==3.3.2",
    "pyyaml>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
llm = [
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.30",
]
dev = ["pytest>=7"]

[project.scripts]
imdbsent = "imdbsent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
